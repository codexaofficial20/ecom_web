{% extends 'shop/base.html' %}
{% block content %}
<div class="max-w-xl mx-auto bg-white border border-slate-100 p-8 rounded-3xl shadow-sm">
    <h1 class="text-2xl font-extrabold mb-6">Complete Your Order</h1>
    
    <form method="POST" class="space-y-6">
        {% csrf_token %}
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Delivery Location</label>
            <textarea name="location" rows="3" required class="w-full border border-slate-200 rounded-xl p-3 focus:ring-2 focus:ring-sky-500 outline-none" placeholder="Enter full address..."></textarea>
        </div>
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Contact Number</label>
            <input type="text" name="contact" required class="w-full border border-slate-200 rounded-xl p-3 focus:ring-2 focus:ring-sky-500 outline-none" placeholder="10-digit mobile number">
        </div>
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-2">Payment Option</label>
            <div class="space-y-3">
                <label class="flex items-center gap-3 border border-slate-200 p-4 rounded-xl cursor-pointer hover:border-sky-500 transition">
                    <input type="radio" name="payment_method" value="UPI" checked class="text-sky-500 focus:ring-sky-500">
                    <div>
                        <span class="font-bold block">UPI Payment</span>
                        <span class="text-xs text-slate-500">Auto-links to your app (Secure)</span>
                    </div>
                </label>
                <label class="flex items-center gap-3 border border-slate-200 p-4 rounded-xl cursor-pointer hover:border-sky-500 transition">
                    <input type="radio" name="payment_method" value="COD" class="text-sky-500 focus:ring-sky-500">
                    <div>
                        <span class="font-bold block">Cash on Delivery</span>
                        <span class="text-xs text-slate-500">+₹10 platform fee added</span>
                    </div>
                </label>
            </div>
        </div>
        <button type="submit" class="w-full bg-sky-500 hover:bg-sky-600 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-sky-100 transition">Confirm Order</button>
    </form>
</div>
{% endblock %}
