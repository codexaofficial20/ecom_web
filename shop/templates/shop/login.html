{% extends 'shop/base.html' %}
{% block content %}
<div class="max-w-md mx-auto bg-white border border-slate-100 p-8 rounded-3xl shadow-sm my-10">
    <h1 class="text-2xl font-extrabold mb-6 text-center">Welcome Back</h1>
    <form method="POST" class="space-y-4">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="w-full bg-sky-500 hover:bg-sky-600 text-white font-bold py-3 rounded-xl transition">Login</button>
    </form>
    <p class="text-center text-sm text-slate-600 mt-6">New here? <a href="{% url 'signup' %}" class="text-sky-500 font-bold">Create an account</a></p>
</div>
{% endblock %}
